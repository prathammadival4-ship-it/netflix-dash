<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="0.55" stop-color="#1a0407"/>
      <stop offset="1" stop-color="#3a0509"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b20710"/>
      <stop offset="0.5" stop-color="#e50914"/>
      <stop offset="1" stop-color="#ff4b55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e50914" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e50914" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <style>
      .title{font:900 92px 'Arial Black',Impact,Arial,sans-serif;letter-spacing:14px;fill:url(#red)}
      .sub{font:600 24px 'Segoe UI',Arial,sans-serif;letter-spacing:6px;fill:#e5e5e5}
      .tag{font:500 16px 'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#9a9a9a}
      .pulse{animation:pulse 3.5s ease-in-out infinite;transform-origin:900px 160px}
      .rise{animation:rise 1.4s ease-out both}
      .rise2{animation:rise 1.4s .4s ease-out both}
      .rise3{animation:rise 1.4s .8s ease-out both}
      .bar{animation:grow 2.4s ease-out both;transform-origin:bottom}
      @keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
      @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
      @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    </style>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle class="pulse" cx="900" cy="160" r="230" fill="url(#glow)"/>
  <!-- animated mini bars -->
  <g opacity="0.9" transform="translate(790,60)">
    <rect class="bar" x="0"   y="120" width="26" height="80"  rx="4" fill="#e50914" style="animation-delay:.2s"/>
    <rect class="bar" x="40"  y="70"  width="26" height="130" rx="4" fill="#ff2a35" style="animation-delay:.4s"/>
    <rect class="bar" x="80"  y="30"  width="26" height="170" rx="4" fill="#e50914" style="animation-delay:.6s"/>
    <rect class="bar" x="120" y="90"  width="26" height="110" rx="4" fill="#b20710" style="animation-delay:.8s"/>
    <rect class="bar" x="160" y="10"  width="26" height="190" rx="4" fill="#ff2a35" style="animation-delay:1s"/>
    <rect class="bar" x="200" y="60"  width="26" height="140" rx="4" fill="#e50914" style="animation-delay:1.2s"/>
    <rect class="bar" x="240" y="110" width="26" height="90"  rx="4" fill="#b20710" style="animation-delay:1.4s"/>
    <rect x="-10" y="202" width="290" height="3" fill="#e50914" opacity="0.6"/>
  </g>
  <text class="title rise" x="60" y="150">NETFLIX</text>
  <text class="sub rise2" x="64" y="205">CONTENT ANALYTICS DASHBOARD</text>
  <text class="tag rise3" x="64" y="245">POWER BI  •  DAX  •  PYTHON  •  KAGGLE</text>
  <rect x="0" y="300" width="1200" height="20" fill="url(#red)"/>
</svg>
